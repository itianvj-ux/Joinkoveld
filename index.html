<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aqua CRM</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="sidebar">

    <div class="logo">
        <h2>Aqua CRM</h2>
        <p>Koveld</p>
    </div>

    <button class="nav active" data-page="dashboard">🏠 Dashboard</button>

    <button class="nav" data-page="customers">👥 Customers</button>

    <button class="nav" data-page="jobs">📅 Jobs</button>

    <button class="nav" data-page="quotes">💲 Quotes</button>

    <button class="nav" data-page="finances">💰 Finances</button>

    <button class="nav" data-page="employees">👷 Employees</button>

    <button class="nav" data-page="settings">⚙ Settings</button>

</div>

<div class="content">

<section id="dashboard" class="page active">

<h1>Dashboard</h1>

<div class="cards">

<div class="card">
<h3>Customers</h3>
<h2 id="customerCount">0</h2>
</div>

<div class="card">
<h3>Jobs</h3>
<h2 id="jobCount">0</h2>
</div>

<div class="card">
<h3>Income</h3>
<h2 id="incomeTotal">$0</h2>
</div>

<div class="card">
<h3>Profit</h3>
<h2 id="profitTotal">$0</h2>
</div>

</div>

</section>

<section id="customers" class="page">

<h1>Customers</h1>

<button id="addCustomerBtn">
+ Add Customer
</button>

<table>

<thead>

<tr>

<th>Name</th>

<th>Phone</th>

<th>Email</th>

<th>Address</th>

<th>Notes</th>

<th></th>

</tr>

</thead>

<tbody id="customerTable">

</tbody>

</table>

</section>

<section id="jobs" class="page">

<h1>Jobs</h1>

<button id="addJobBtn">
+ Add Job
</button>

<div id="jobList">

</div>

</section>

<section id="quotes" class="page">

<h1>Quote Calculator</h1>

<div id="quoteCalculator">

</div>

</section>

<section id="finances" class="page">

<h1>Finances</h1>

<div class="cards">

<div class="card">

<h3>Total Income</h3>

<h2 id="financeIncome">$0</h2>

</div>

<div class="card">

<h3>Total Expenses</h3>

<h2 id="financeExpense">$0</h2>

</div>

<div class="card">

<h3>Profit</h3>

<h2 id="financeProfit">$0</h2>

</div>

</div>

<button id="addIncomeBtn">

+ Add Income

</button>

<button id="addExpenseBtn">

+ Add Expense

</button>

<div id="financeTable">

</div>

</section>

<section id="employees" class="page">

<h1>Employees</h1>

<button id="addEmployeeBtn">

+ Add Employee

</button>

<div id="employeeList">

</div>

</section>

<section id="settings" class="page">

<h1>Settings</h1>

<p>Google Sheets Connection</p>

<button id="connectGoogle">

Connect Google Sheets

</button>

</section>

</div>

<div id="modalContainer"></div>

<script src="google.js"></script>

<script src="script.js"></script>

</body>

</html>
