<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Koveld Services CRM</title>
  <style>
    :root {
      --bg-color: #f9f9f9;
      --card-bg: #ffffff;
      --text-color: #333333;
      --primary-color: #ff6500;
      --secondary-color: #111111;
      --accent-color: #e65c00;
      --border-color: #e0e0e0;
      --font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      display: flex;
      min-height: 100vh;
    }

    sidebar {
      width: 260px;
      background-color: #ffffff;
      border-right: 1px solid var(--border-color);
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
    }

    sidebar h2 {
      color: var(--secondary-color);
      margin-top: 0;
      margin-bottom: 30px;
      font-size: 24px;
      letter-spacing: -0.5px;
    }

    sidebar nav {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    sidebar nav a {
      color: var(--text-color);
      text-decoration: none;
      padding: 12px 16px;
      border-radius: 6px;
      font-weight: 500;
      transition: background-color 0.2s, color 0.2s;
    }

    sidebar nav a:hover {
      background-color: #f0f0f0;
      color: var(--primary-color);
    }

    main {
      flex: 1;
      padding: 40px;
      overflow-y: auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      color: var(--secondary-color);
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 30px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 25px;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card h3 {
      margin: 0;
      font-size: 18px;
      color: var(--secondary-color);
    }

    .btn {
      background-color: var(--secondary-color);
      color: #ffffff;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      width: fit-content;
      transition: background-color 0.2s;
    }

    .btn:hover {
      background-color: var(--primary-color);
    }

    .btn-secondary {
      background-color: transparent;
      color: var(--secondary-color);
      border: 1px solid var(--border-color);
    }

    .btn-secondary:hover {
      background-color: #f0f0f0;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-weight: 500;
      font-size: 14px;
      color: var(--secondary-color);
    }

    input[type="text"], input[type="number"], select {
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 14px;
      width: 100%;
      box-sizing: border-box;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .checkbox-group input {
      width: 18px;
      height: 18px;
      Accent-color: var(--primary-color);
    }

    .result-display {
      margin-top: 10px;
      padding: 15px;
      background-color: #f4f4f4;
      border-radius: 6px;
      font-weight: 600;
      text-align: right;
      color: var(--secondary-color);
    }
  </style>
</head>
<body>

  <sidebar>
    <h2>Koveld Services</h2>
    <nav>
      <a href="#dashboard">Dashboard</a>
      <a href="#clients">Clients</a>
      <a href="#quotes">Quotes</a>
      <a href="# Mulch Calc">Mulch Calculator</a>
      <a href="#settings">Settings</a>
    </nav>
  </sidebar>

  <main>
    <header>
      <h1>Dashboard</h1>
      <button class="btn">New Client</button>
    </header>

    <div class="dashboard-grid">
      <div class="card">
        <h3>Quick Mulch Calculator</h3>
        <div class="form-group">
          <label>Length (ft):</label>
          <input type="number" id="mulchLength" placeholder="0">
        </div>
        <div class="form-group">
          <label>Width (ft):</label>
          <input type="number" id="mulchWidth" placeholder="0">
        </div>
        <div class="form-group">
          <label>Depth (inches):</label>
          <input type="number" id="mulchDepth" placeholder="4" value="4">
        </div>
        <div class="form-group">
          <label>Bags Required:</label>
          <input type="number" id="mulchBags" placeholder="0">
        </div>
        <div class="form-group">
          <label>Bag Cost ($):</label>
          <input type="number" id="mulchCostPerBag" placeholder="0.00">
        </div>
        <button class="btn btn-secondary" onclick="calculateMulch()">Calculate Mulch</button>
        <div class="result-display" id="mulchTotal">Total: $0.00</div>
      </div>

      <div class="card">
        <h3>Quote Generator</h3>
        <div class="form-group">
          <label>Estimated Hours:</label>
          <input type="number" id="quoteHours" placeholder="0">
        </div>
        <div class="checkbox-group">
          <input type="checkbox" id="overgrownToggle">
          <label for="overgrownToggle">Overgrown Property ($75.00 Fee)</label>
        </div>
        <button class="btn btn-secondary" onclick="generateQuote()">Generate Quote</button>
        <div class="result-display" id="quoteTotal">Total: $0.00</div>
      </div>
    </div>
  </main>

  <script>
    function calculateMulch() {
      const length = parseFloat(document.getElementById('mulchLength').value) || 0;
      const width = parseFloat(document.getElementById('mulchWidth').value) || 0;
      const depth = parseFloat(document.getElementById('mulchDepth').value) || 4;
      const bags = parseFloat(document.getElementById('mulchBags').value) || 0;
      const costPerBag = parseFloat(document.getElementById('mulchCostPerBag').value) || 0;
      
      const totalCost = bags * costPerBag;
      document.getElementById('mulchTotal').textContent = `Total: $${totalCost.toFixed(2)}`;
    }

    function generateQuote() {
      const hours = parseFloat(document.getElementById('quoteHours').value) || 0;
      const isOvergrown = document.getElementById('overgrownToggle').checked;
      
      const hourlyRate = 100;
      const minCharge = 35;
      const overgrownFee = 75;

      let total = hours * hourlyRate;
      
      if (isOvergrown) {
        total += overgrownFee;
      }

      if (total < minCharge && total > 0) {
        total = minCharge;
      }

      document.getElementById('quoteTotal').textContent = `Total: $${total.toFixed(2)}`;
    }
  </script>
</body>
</html>
